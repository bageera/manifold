stages:
  - test

test:
  stage: test
  image: rust:1.91
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: cargo-cache
    paths:
      - .cargo/
      - target/
  script:
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
    - cargo build --release
    - apt-get update -qq && apt-get install -y -qq python3
    - python3 scripts/fuzz.py --trials 300
    - ./target/release/manifold encode testdata/screenshot_640x400.png -o /tmp/s.mnf5
    - ./target/release/manifold verify testdata/screenshot_640x400.png /tmp/s.mnf5
    - ./target/release/manifold encode testdata/screenshot_640x400.png -o /tmp/g.mnf5 --geom
    - ./target/release/manifold verify testdata/screenshot_640x400.png /tmp/g.mnf5
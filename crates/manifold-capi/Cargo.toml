[package]
name = "manifold-codec-capi"
version = "1.11.1"
edition = "2021"
rust-version = "1.91"
description = "C FFI for the Manifold lossless RGB8 codecs"
license = "MIT"
repository = "https://github.com/bageera/manifold"
publish = true

[lib]
name = "manifold_capi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
manifold-codec = { path = "../..", version = "1.11.0" }

[package.metadata.notes]
stability = "C ABI v1: never panics on caller data; all fallibility through status codes"
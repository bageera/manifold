[workspace]
members = [".", "crates/mnf-subspace", "crates/mnf-mans", "crates/manifold-capi"]

[package]
name = "manifold"
version = "1.2.1"
edition = "2021"
rust-version = "1.91"
description = "Lossless RGB8 shared-patch atlas image codecs (MNF5/MNF6/MNF7/MNF8)"
license = "MIT"
repository = "https://github.com/bageera/manifold"
keywords = ["image", "compression", "lossless", "codec", "research"]
categories = ["compression", "multimedia::images"]
[package.metadata.notes]
stability = "MNF5/6/7/8 formats frozen; error enum + limits = v1.x semver"

[lib]
name = "manifold"
path = "src/lib.rs"

[[bin]]
name = "manifold"
path = "src/main.rs"
required-features = ["image-io"]

[features]
default = ["image-io"]
image-io = ["dep:image", "dep:png"]

[dependencies]
flate2 = "1.0"
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
png = { version = "0.17", optional = true }
zstd = "0.13"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
[workspace]
members = [".", "crates/mnf-subspace"]

[package]
name = "manifold"
version = "1.1.0"
edition = "2021"
description = "Lossless RGB8 shared-patch atlas image codecs (MNF5/MNF6/MNF7)"
license = "MIT"

[lib]
name = "manifold"
path = "src/lib.rs"

[dependencies]
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.17"
zstd = "0.13"